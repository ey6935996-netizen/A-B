name: Prepare ABVideo Build Transfer

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  request-source-attachment:
    runs-on: ubuntu-latest
    steps:
      - name: Request source attachment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 3 --repo "${{ github.repository }}" --body "ABVideo Windows build source transfer requested. Reply to the GitHub notification email for this comment and attach **abvideo-build-src-min.tar.xz**."
