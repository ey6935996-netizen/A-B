name: Build ABVideo ModernSoft

on:
  pull_request:
    branches: [main]
    paths:
      - 'abvideo-build/**'
      - '.github/workflows/build-abvideo.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build workspace
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Reconstruct source and apply UI patch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'ABVideo-Windows-Builder'
          }
          $uri = "https://api.github.com/repos/$env:GH_REPOSITORY/issues/3/comments?per_page=100"
          $comments = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers

          $chunks = @{}
          $expectedCount = $null
          $sourcePattern = '(?s)ABVIDEO_SOURCE_CHUNK_BEGIN\s+(\d{3})\s+(\d{3})\s*\r?\n(.*?)\r?\nABVIDEO_SOURCE_CHUNK_END\s+\1'
          $patchPattern = '(?s)ABVIDEO_UI_PATCH_BEGIN\s*\r?\n(.*?)\r?\nABVIDEO_UI_PATCH_END'
          $uiPatch = $null

          foreach ($comment in $comments) {
            $body = [string]$comment.body
            $sourceMatch = [regex]::Match($body, $sourcePattern)
            if ($sourceMatch.Success) {
              $index = [int]$sourceMatch.Groups[1].Value
              $count = [int]$sourceMatch.Groups[2].Value
              if ($null -eq $expectedCount) { $expectedCount = $count }
              if ($expectedCount -ne $count) { throw "Inconsistent source chunk count: $count" }
              $chunks[$index] = $sourceMatch.Groups[3].Value -replace '\s', ''
            }

            $patchMatch = [regex]::Match($body, $patchPattern)
            if ($patchMatch.Success) {
              $uiPatch = $patchMatch.Groups[1].Value
            }
          }

          if ($null -eq $expectedCount) { throw 'No ABVideo source chunks were found in issue #3.' }
          if ($chunks.Count -ne $expectedCount) {
            throw "Source chunk count mismatch. Expected $expectedCount, found $($chunks.Count)."
          }
          if ([string]::IsNullOrWhiteSpace($uiPatch)) { throw 'The ABVideo UI patch was not found in issue #3.' }

          $builder = [System.Text.StringBuilder]::new()
          for ($i = 0; $i -lt $expectedCount; $i++) {
            if (-not $chunks.ContainsKey($i)) { throw "Missing source chunk $i" }
            [void]$builder.Append([string]$chunks[$i])
          }

          $archive = 'abvideo-source.tar.xz'
          [IO.File]::WriteAllBytes((Join-Path $PWD $archive), [Convert]::FromBase64String($builder.ToString()))
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content -LiteralPath 'abvideo-build/source.sha256' -Raw).Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Reconstructed source hash mismatch. Expected $expected, actual $actual"
          }

          New-Item -ItemType Directory -Path 'source' -Force | Out-Null
          tar -xf $archive -C 'source'
          if ($LASTEXITCODE -ne 0) { throw "tar failed with exit code $LASTEXITCODE" }

          $patchPath = Join-Path $PWD 'abvideo-ui-v2.patch'
          $normalizedPatch = $uiPatch.Replace("`r`n", "`n")
          [IO.File]::WriteAllText($patchPath, $normalizedPatch, [System.Text.UTF8Encoding]::new($false))
          git apply --check --directory=source --whitespace=nowarn $patchPath
          if ($LASTEXITCODE -ne 0) { throw "UI patch validation failed: $LASTEXITCODE" }
          git apply --directory=source --whitespace=nowarn $patchPath
          if ($LASTEXITCODE -ne 0) { throw "UI patch application failed: $LASTEXITCODE" }

          $projectFile = 'source/src/ABVideo.App/ABVideo.App.csproj'
          $projectText = [IO.File]::ReadAllText($projectFile)
          $projectText = $projectText.Replace('<Version>4.0.0</Version>', '<Version>4.0.1</Version>')
          $projectText = $projectText.Replace('<InformationalVersion>4.0.0</InformationalVersion>', '<InformationalVersion>4.0.1</InformationalVersion>')
          [IO.File]::WriteAllText($projectFile, $projectText, [System.Text.UTF8Encoding]::new($false))

      - name: Restore and publish Windows x64 app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore '.\source\src\ABVideo.App\ABVideo.App.csproj' --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed: $LASTEXITCODE" }
          dotnet publish '.\source\src\ABVideo.App\ABVideo.App.csproj' `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output '.\package'
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath 'package/ABVideo.exe' -PathType Leaf)) {
            throw 'Published ABVideo.exe was not found.'
          }

      - name: Bundle FFmpeg and launcher notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'package/tools/ffmpeg' -Force | Out-Null
          curl.exe -L --fail --retry 3 --retry-delay 5 `
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' `
            -o 'ffmpeg-release-essentials.zip'
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg download failed: $LASTEXITCODE" }
          Expand-Archive -LiteralPath 'ffmpeg-release-essentials.zip' -DestinationPath 'ffmpeg-unpacked' -Force
          $ffmpeg = Get-ChildItem -LiteralPath 'ffmpeg-unpacked' -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $ffprobe = Get-ChildItem -LiteralPath 'ffmpeg-unpacked' -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          if ($null -eq $ffmpeg -or $null -eq $ffprobe) { throw 'FFmpeg binaries were not found after extraction.' }
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination 'package/tools/ffmpeg/ffmpeg.exe' -Force
          Copy-Item -LiteralPath $ffprobe.FullName -Destination 'package/tools/ffmpeg/ffprobe.exe' -Force
          @(
            'ABVideo 4.0.1 ModernSoft - Windows x64 免安装版',
            '',
            '本版已拆分“组合制作”和“素材管理”的职责，并加入 ABVideo 应用图标。',
            '启动方法：解压全部文件后，双击 ABVideo.exe。',
            '请勿只把 ABVideo.exe 单独移出文件夹；tools 目录中的 FFmpeg 用于视频处理。'
          ) | Set-Content -LiteralPath 'package/启动说明.txt' -Encoding UTF8

      - name: Create downloadable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'ABVideo-ModernSoft-4.0.1-win-x64-portable.zip'
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path 'package/*' -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zip.sha256.txt" -Value "$hash  $zip" -Encoding ASCII

      - name: Upload runnable package
        uses: actions/upload-artifact@v4
        with:
          name: ABVideo-ModernSoft-4.0.1-win-x64-portable
          path: |
            ABVideo-ModernSoft-4.0.1-win-x64-portable.zip
            ABVideo-ModernSoft-4.0.1-win-x64-portable.zip.sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
