name: PhysicDesk Chinese TTS

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts pydub
      - name: Generate Chinese narration
        run: python synthesize.py
      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: physicdesk-chinese-narration
          path: output/
          retention-days: 1
          compression-level: 6
